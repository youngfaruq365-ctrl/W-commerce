version: '3.9'

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wcommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wcommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wcommerce_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wcommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (session store + pub/sub) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wcommerce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    networks:
      - wcommerce_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend Application ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wcommerce_backend
    restart: unless-stopped
    env_file:
      # Create .env.production on deployment
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-wcommerce}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      NODE_ENV: production
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wcommerce_network
    volumes:
      - uploads:/app/backend/storage/uploads

  # ── Frontend (React + Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wcommerce_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wcommerce_network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  wcommerce_network:
    driver: bridge
