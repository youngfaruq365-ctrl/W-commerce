name: Deploy Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Frontend
        env:
          VITE_APP_URL: https://w-commerce.app
        run: npm run build:production

      - name: Verify PostgreSQL schema is in sync
        run: node scripts/sync-postgres-schema.cjs --check

      - name: Verify Backend Syntax
        run: |
          node --check backend/server.cjs
          node --check backend/src/app.cjs
